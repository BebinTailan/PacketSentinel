[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packetsentinel"
version = "0.1.0.dev0"
description = "Dependency-free PCAP analyzer that detects suspicious network behavior."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tailan Bebin" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking",
]

[project.scripts]
packetsentinel = "packetsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["packetsentinel*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
